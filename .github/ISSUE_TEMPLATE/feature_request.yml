name: 💡 功能建议 / Feature Request
description: 提出新功能或改进建议 / Suggest a new feature or improvement
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！英文或中文均可。
        Thanks for the suggestion! English or Chinese is fine.

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem to solve
      description: 你遇到了什么困难？/ What difficulty are you facing?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案 / Proposed solution
      description: 你希望它怎么工作？/ How would you like it to work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / Alternatives considered
      description: 可选。你考虑过的其他方案 / Optional. Other approaches you've considered
    validations:
      required: false
